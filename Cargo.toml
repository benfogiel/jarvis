[workspace]

[package]
name = "jarvis-orb"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.17"
dotenvy = "0.15.7"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
whisper-rs = "0.16"
